<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Sorteio ao vivo · Fresh Wave</title>
<style>
:root{--navy:#1E2B24;--blue:#00873D;--teal:#00BF63;--muted:#4A5F52}
*{box-sizing:border-box}
html{background:#C4EBD2}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--navy);font-family:"Segoe UI","IBM Plex Sans",system-ui,-apple-system,sans-serif;background:transparent;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,min(2.6vw,2.6vh),30px);padding:clamp(12px,min(3vw,3vh),36px);text-align:center;overflow-x:hidden}
.logos{display:flex;flex-direction:column;align-items:center;gap:6px}
.logos .t{height:clamp(34px,min(8vw,8vh),100px)}.logos .f{height:clamp(26px,min(6vw,6vh),76px)}.logos .s{height:clamp(12px,min(2.4vw,2.4vh),30px)}
.badge{padding:.5em 1.6em;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--teal));color:#fff;font-weight:800;font-style:italic;letter-spacing:.05em;font-size:clamp(13px,min(2.2vw,3vh),30px)}
.card{width:min(1100px,100%)}
.msg,.gc{background:rgba(255,255,255,.9);border:1px solid #fff;border-radius:32px;padding:clamp(22px,min(4vw,4.5vh),56px) clamp(16px,3vw,40px);box-shadow:0 14px 36px rgba(30,43,36,.14)}
.nome{font-size:clamp(30px,min(8.5vw,12vh),120px);font-weight:900;font-style:italic;line-height:1.05;word-break:break-word}
.curso{margin-top:.3em;font-size:clamp(16px,min(3.6vw,5vh),48px);font-weight:800;color:var(--blue)}
.tempo[hidden]{display:none}
.tempo{margin-top:clamp(10px,min(2.4vw,2.4vh),28px);display:inline-block;padding:.4em 1.6em .5em;border-radius:22px;background:#fff;border:3px solid var(--blue)}
.tempo small{display:block;font-size:clamp(12px,1.8vw,24px);font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tempo b{display:block;font-size:clamp(36px,min(8vw,12vh),110px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1.05;color:var(--blue)}
.tempo.ok{border-color:var(--blue);background:#EAF8EF}.tempo.ok b{font-size:clamp(28px,5.5vw,80px)}.tempo.ok small:empty{display:none}
.tempo.fim{border-color:#b3261e}.tempo.fim b{color:#b3261e;font-size:clamp(28px,5.5vw,80px)}
.tempo.urg b{color:#b3261e;animation:pulse .5s infinite alternate}
.msg{font-size:clamp(20px,3.6vw,52px);font-weight:800;font-style:italic;color:var(--muted)}
.pop{animation:pop .7s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.spin{animation:pulse .5s infinite alternate}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
.ant{font-size:clamp(12px,1.6vw,22px);color:var(--muted);max-width:1100px;line-height:1.6}
.ant b{color:var(--navy)}
.foot{font-size:clamp(11px,1.3vw,18px);color:var(--muted)}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){.pop,.spin{animation:none}}
.cards{display:flex;flex-wrap:wrap;gap:clamp(14px,2.4vw,30px);justify-content:center}
.gc{flex:1 1 380px;min-width:0}
.gc .nome{font-size:clamp(26px,min(8.5vw,12vh),120px)}
.cards.n2 .gc .nome{font-size:clamp(24px,min(5vw,9vh),84px)}
.cards.n3 .gc .nome,.cards.n4 .gc .nome,.cards.n5 .gc .nome{font-size:clamp(20px,min(3.6vw,7vh),60px)}
.cards.n2 .gc .curso{font-size:clamp(14px,min(2.4vw,4vh),36px)}
.cards.n3 .gc .curso,.cards.n4 .gc .curso,.cards.n5 .gc .curso{font-size:clamp(12px,min(1.8vw,3vh),26px)}
.cards.n2 .tempo b{font-size:clamp(30px,min(5vw,9vh),72px)}
.cards.n3 .tempo b,.cards.n4 .tempo b,.cards.n5 .tempo b{font-size:clamp(24px,min(3.6vw,7vh),52px)}
.cards.n2 .tempo small,.cards.n3 .tempo small,.cards.n4 .tempo small,.cards.n5 .tempo small{font-size:clamp(10px,1.2vw,16px)}
.gc.ph .nome,.gc.ph .curso,.gc.ph .tempo{display:none}
.gc .ph-t{display:none;font-size:clamp(20px,3.4vw,48px);font-weight:800;font-style:italic;color:var(--muted)}
.gc.ph .ph-t{display:block}
html{background:#BFE9F5}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:url(fundo_v.jpg) center/cover no-repeat}
@media (min-width:700px){body::before{background-image:url(fundo_h.jpg)}}
.bub{display:none}
</style>
<div class="logos"><img class="t" src="clube/trident.png" alt="Trident"><img class="f" src="clube/freshwave.png" alt="Fresh Wave"><img class="s" src="clube/slogan.png" alt="Uma onda de frescor"></div>
<div class="badge">SORTEIO DE ECOBAGS</div>
<main class="card" aria-live="polite">
  <div class="msg" id="msg">Aguardando o sorteio...</div>
  <div class="cards" id="cards"></div>
</main>
<div class="ant" id="ant"></div>
<div class="foot" id="foot"></div>
<canvas id="cf"></canvas>
<script>
var API='https://script.google.com/macros/s/AKfycbzjTIP9Xidsa3iBuh1OlVdImGOGUZhOu7MwuUbchFzWtvQNu5C5qmWO65RLDKFQeCbkVg/exec';
var $=function(i){return document.getElementById(i)};
var TOTAL=180,VOLTA=15000,PH=2400,LIM=TOTAL*1000+PH+VOLTA; // 3 min para se apresentar; 15 s de "Presente" antes de voltar ao Aguardando
var cards={},tPres={};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function mk(g){
  var el=document.createElement('div');el.className='gc ph';
  el.innerHTML='<div class="ph-t">Sorteando...</div><div class="nome">'+esc(g.nome)+'</div><div class="curso">'+esc(g.curso)+'</div><div class="tempo"><small class="tl">Tempo para se apresentar</small><b class="tv">03:00</b></div>';
  return {el:el,rev:false,t:el.querySelector('.tempo'),tl:el.querySelector('.tl'),tv:el.querySelector('.tv')};
}
function tick(){
  fetch(API+'?action=ultimo').then(function(r){return r.json()}).then(function(r){
    if(!r.ok)return;var now=Date.now();
    $('foot').textContent=r.total+' cadastrados · '+r.restantes+' ainda concorrendo';
    var ativos=[],ant=[];
    r.recentes.forEach(function(g){
      if(g.presente&&!tPres[g.chave])tPres[g.chave]=now;
      var vis=g.idade<LIM&&!(g.presente&&now-tPres[g.chave]>VOLTA);
      (vis?ativos:ant).push(g);
    });
    ativos.reverse(); // quem foi sorteado primeiro fica à esquerda
    var keep={};
    ativos.forEach(function(g){
      keep[g.chave]=1;var c=cards[g.chave];
      if(!c){c=cards[g.chave]=mk(g);$('cards').appendChild(c.el)}
      c.idade=g.idade;c.at=now;c.presente=g.presente;
    });
    Object.keys(cards).forEach(function(k){if(!keep[k]){cards[k].el.remove();delete cards[k]}});
    // ordena no DOM
    // reordena só se a ordem mudou (mexer no DOM reinicia a animação "pop")
    var ordem=ativos.map(function(g){return cards[g.chave].el}),atual=[].slice.call($('cards').children);
    if(ordem.length!==atual.length||ordem.some(function(e,i){return e!==atual[i]}))ordem.forEach(function(e){$('cards').appendChild(e)});
    var n=ativos.length;$('cards').className='cards'+(n>1?' n'+Math.min(n,5):'');
    $('msg').hidden=n>0;
    $('ant').innerHTML=ant.length?'<b>Ganhadores anteriores:</b> '+ant.slice(0,6).map(function(a){return esc(a.nome)}).join(' · '):'';
    relogio();
  }).catch(function(){});
}
function fmt2(x){return ('0'+x).slice(-2)}
function relogio(){
  var now=Date.now();
  Object.keys(cards).forEach(function(k){
    var c=cards[k],ms=c.idade+(now-c.at);
    if(ms<PH){c.el.className='gc ph';return}
    if(!c.rev){c.rev=true;if(ms<PH+20000){c.el.className='gc pop';confete()}else c.el.className='gc'}
    else if(c.el.classList.contains('ph'))c.el.className='gc';
    if(c.presente){c.t.className='tempo ok';c.tl.textContent='';c.tv.textContent='Presente! Parabéns!';return}
    var rest=TOTAL-Math.floor((ms-PH)/1000);
    if(rest<=0){c.t.className='tempo fim';c.tl.textContent='Tempo para se apresentar';c.tv.textContent='Tempo esgotado';return}
    c.tl.textContent='Tempo para se apresentar';c.t.className='tempo'+(rest<=10?' urg':'');
    c.tv.textContent=fmt2(Math.floor(rest/60))+':'+fmt2(rest%60);
  });
}
setInterval(relogio,250);
tick();setInterval(tick,1500);
function confete(){
  var c=$('cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  var cores=['#00BF63','#00873D','#F58A1F','#E94B5B','#7ED321','#F58FB2','#F2D13D'],p=[];
  for(var i=0;i<160;i++)p.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,v:2+Math.random()*4,r:4+Math.random()*7,c:cores[i%7],a:Math.random()*6});
  var f=0;(function an(){x.clearRect(0,0,c.width,c.height);p.forEach(function(q){q.y+=q.v;q.a+=.1;x.fillStyle=q.c;x.save();x.translate(q.x+Math.sin(q.a)*10,q.y);x.rotate(q.a);x.fillRect(-q.r/2,-q.r/2,q.r,q.r*1.6);x.restore()});if(++f<220)requestAnimationFrame(an);else x.clearRect(0,0,c.width,c.height)})();
}
</script>
</html>
