<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manual de Identidade Visual · Trident Fresh Wave</title>
<style>
:root{--bg:#EAF8EF;--card:#ffffff;--fg:#12261B;--muted:#55685B;--line:#d8e6d5;--accent:#5e8016}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#13220f;--card:#14281D;--fg:#E6F0E9;--muted:#9DB5A5;--line:#2e4527;--accent:#5CE1A0}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;padding:32px 16px}
main{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:clamp(1.5rem,4vw,2rem);line-height:1.2;margin:0}
.sub{color:var(--muted);margin:6px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
h2{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
p{margin:0 0 10px}
a{color:var(--accent);overflow-wrap:anywhere}
</style>
<main>
  <header>
    <h1>Manual de Identidade Visual</h1>
    <p class="sub">Trident Fresh Wave · Propaganda e Marketing, UNIP</p>
  </header>
  <section class="card">
    <h2>Versão de teste</h2>
    <p>Este arquivo é provisório e será substituído pelo Manual de Identidade Visual final.</p>
    <p><a href="miv.pdf"><strong>Abrir o MIV (PDF)</strong></a></p>
  </section>
  <section class="card" style="padding:0;overflow:hidden">
    <object data="miv.pdf" type="application/pdf" width="100%" height="520">
      <p style="padding:20px">Seu navegador não mostra o PDF aqui. Use o link acima para abrir.</p>
    </object>
  </section>
</main>
</html>
