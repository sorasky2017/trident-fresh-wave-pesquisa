<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Sorteio · Trident Fresh Wave</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--navy:#1E2B24;--blue:#00873D;--teal:#00BF63;--green:#00BF63;--ink:#12261B;--muted:#4A5F52;--line:#d6eecf;--card:rgba(255,255,255,.82)}
*{box-sizing:border-box}
html{background:#C4EBD2}
body{margin:0;color:var(--ink);font-family:"Segoe UI","IBM Plex Sans",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;
 background:transparent;isolation:isolate;background-attachment:scroll;min-height:100vh;position:relative;overflow-x:hidden}
.bub{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.75),rgba(255,255,255,.12));pointer-events:none}
main{position:relative;max-width:480px;margin:0 auto;padding:0 16px 32px;display:flex;flex-direction:column;gap:18px}
.hero{text-align:center;padding:34px 0 6px}
.top{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--navy);font-weight:600}
.logo{display:block;margin:14px auto 0}
.logo.t{width:180px}.logo.f{width:290px;margin-top:2px}.logo.s{width:270px;margin-top:6px}
.badge{display:inline-block;margin-top:18px;padding:9px 22px;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--teal));color:#fff;font-weight:800;font-style:italic;letter-spacing:.04em;font-size:1.15rem;box-shadow:0 6px 16px rgba(0,135,61,.28)}
.lead{margin:12px auto 0;max-width:340px;color:var(--navy)}
.card{background:var(--card);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.9);border-radius:22px;padding:20px 18px;box-shadow:0 10px 28px rgba(30,43,36,.12)}
.chip{display:inline-block;background:var(--blue);color:#fff;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:6px 14px;border-radius:999px;margin-bottom:14px}
.chip.g{background:var(--teal)}
h2{margin:0 0 4px;font-size:1.25rem;font-style:italic;font-weight:800;color:var(--navy);line-height:1.2}
.sub{margin:0 0 14px;color:var(--muted);font-size:.92rem}
label.f{display:block;font-size:.85rem;font-weight:700;color:var(--navy);margin:12px 0 4px}
input[type=text],input[type=email]{width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
input:focus,button:focus-visible,.tile:focus-visible{outline:3px solid rgba(0,135,61,.45);outline-offset:2px}
.tiles{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;margin:0 -4px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.tile{flex:0 0 88px;scroll-snap-align:center;border:3px solid transparent;border-radius:18px;background:#fff;padding:0;cursor:pointer;overflow:hidden;text-align:center;font:inherit;box-shadow:0 4px 12px rgba(30,43,36,.15);transition:transform .15s}
.pic{height:104px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;background:radial-gradient(circle at 24% 18%,rgba(255,255,255,.9) 0 7px,transparent 8px),radial-gradient(circle at 80% 30%,rgba(255,255,255,.7) 0 5px,transparent 6px),radial-gradient(circle at 70% 72%,rgba(255,255,255,.6) 0 9px,transparent 10px),radial-gradient(ellipse at 50% 100%,rgba(255,255,255,.55),transparent 60%),linear-gradient(180deg,var(--a),var(--b))}
.tile img{display:block;height:86px;width:auto;filter:drop-shadow(0 6px 6px rgba(20,35,47,.3))}
.tile span{display:block;font-size:.66rem;font-weight:700;line-height:1.2;padding:7px 4px 9px;color:#fff}
.tile[aria-checked=true]{transform:translateY(-3px);border-color:var(--navy)}
.tile[aria-checked=true] span::before{content:"✓ "}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.82rem;color:var(--muted);margin-top:12px}
.check input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--blue)}
.btn{width:100%;margin-top:16px;font:inherit;font-weight:800;font-style:italic;letter-spacing:.03em;font-size:1.05rem;color:#fff;background:linear-gradient(90deg,var(--blue),var(--teal) 60%,var(--green));border:0;border-radius:999px;padding:15px;cursor:pointer;box-shadow:0 8px 18px rgba(0,135,61,.3)}
.err{color:#b3261e;font-size:.85rem;margin:10px 0 0;min-height:1em}
.ticket{position:relative;border-radius:18px;padding:18px;text-align:center;color:#fff;background:linear-gradient(135deg,var(--blue),var(--teal));overflow:hidden}
.ticket::before,.ticket::after{content:"";position:absolute;top:50%;width:22px;height:22px;border-radius:50%;background:#e2f8d9;transform:translateY(-50%)}
.ticket::before{left:-11px}.ticket::after{right:-11px}
.ticket small{display:block;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;opacity:.92}
.ticket b{display:block;font-size:2rem;font-style:italic;letter-spacing:.06em;margin:4px 0}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:10px 12px;font-size:.93rem}
.steps i{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-weight:800;background:linear-gradient(135deg,var(--blue),var(--teal))}
.offers{display:grid;gap:8px}
.offer{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:10px 12px;font-size:.92rem}
.dot{width:16px;height:16px;border-radius:50%;flex:none}
.offer em{margin-left:auto;font-style:normal;font-size:.78rem;font-weight:700;color:var(--blue);text-align:right}
.note{font-size:.75rem;color:var(--muted);text-align:center;margin:0 8px}
[hidden]{display:none!important}
main{min-height:100vh;min-height:100dvh;justify-content:center;padding-top:16px;padding-bottom:16px}
.hero{padding:0}
.opts{display:grid;gap:16px;margin-top:10px}
.opt{display:block;text-align:center;text-decoration:none;font-weight:800;font-style:italic;letter-spacing:.03em;font-size:1.25rem;color:#fff;background:linear-gradient(90deg,var(--blue),var(--teal) 60%,var(--green));border-radius:999px;padding:20px 16px;box-shadow:0 8px 20px rgba(0,135,61,.3)}
.opt.alt{background:#fff;color:var(--blue);border:2.5px solid var(--blue);box-shadow:0 8px 20px rgba(30,43,36,.12)}
.opt:focus-visible{outline:3px solid rgba(0,135,61,.45);outline-offset:3px}
@media (min-width:820px){
main{max-width:860px;gap:34px}
.logo.t{width:260px}.logo.f{width:420px;margin-top:4px}.logo.s{width:390px;margin-top:10px}
.opts{grid-template-columns:1fr 1fr;gap:24px;width:100%}
.opt{font-size:1.5rem;padding:28px 20px;transition:transform .15s,box-shadow .15s}
.opt:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(0,135,61,.35)}
.note{font-size:.9rem}
}
main{max-width:860px}
.hero{padding:0}
.logo.t{width:150px}.logo.f{width:250px}.logo.s{width:230px}
#login{text-align:center}
input[type=password]{width:100%;font:inherit;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.pin{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.pin input{max-width:240px;text-align:center;letter-spacing:.2em}
.stage{text-align:center;padding:30px 18px}
.big{font-size:clamp(2.4rem,7vw,4.6rem);font-weight:900;font-style:italic;line-height:1.1;color:var(--navy);margin:8px 0}
.curso{font-size:clamp(1.1rem,3vw,1.7rem);color:var(--blue);font-weight:700}
.status{color:var(--muted);margin:6px 0 0;min-height:1.4em}
.sec{background:#fff;border:2px solid var(--blue);color:var(--blue)}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.row .btn,.row .sec{width:auto;min-width:220px;margin:0}
.btn.sec{box-shadow:none}
.pop{animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
.spin{animation:pulse .5s infinite alternate}
@keyframes pulse{from{opacity:.4}to{opacity:1}}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--blue);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase}
.codbox{display:inline-block;margin-top:16px;padding:10px 22px;border-radius:14px;background:#fff;border:2px dashed var(--blue);font-size:clamp(14px,2vw,22px);color:var(--muted)}
.codbox b{display:block;font-size:clamp(28px,5vw,56px);letter-spacing:.12em;color:var(--navy)}
.wpp[hidden]{display:none}
.wpp{display:inline-block;text-decoration:none;text-align:center;background:linear-gradient(90deg,#128C4A,#25D366)}
.pres{color:var(--blue);font-weight:700}
.aus{color:#b3261e;font-weight:700}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:9}
.qtd{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:6px;font-weight:700;color:var(--muted)}
.qtd select{font:inherit;font-weight:800;padding:8px 14px;border-radius:12px;border:2px solid var(--blue);background:#fff;color:var(--navy)}
.cards{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;margin-top:8px}
.gc{flex:1 1 380px;max-width:520px;background:#fff;border:2px solid var(--line);border-radius:22px;padding:20px 16px}
.gc.ok{border-color:var(--blue);background:#EAF8EF}
.gc .nm{font-size:clamp(1.6rem,4vw,2.6rem);font-weight:900;font-style:italic;line-height:1.1;color:var(--navy);word-break:break-word}
.gc .cu{margin-top:4px;font-size:clamp(1rem,2.2vw,1.35rem);font-weight:700;color:var(--blue)}
.gc .ac{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.gc .ac .btn,.gc .ac .sec,.gc .ac .wpp{width:auto;min-width:0;margin:0;padding:11px 16px;font-size:.95rem}
.gc .codbox{margin-top:12px;padding:6px 14px}
.gc .codbox b{font-size:clamp(1.4rem,3vw,2.1rem)}
.gc .tag{margin-top:10px;font-weight:800;color:var(--blue)}
.gc .tag.no{color:#b3261e}
html{background:#BFE9F5}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:url(fundo_v.jpg) center/cover no-repeat}
@media (min-width:700px){body::before{background-image:url(fundo_h.jpg)}}
.bub{display:none}
.top,.hero .eyebrow{display:inline-block;color:#fff!important;background:rgba(9,44,80,.55);padding:5px 14px;border-radius:999px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
</style>
<body>
<span class="bub" style="width:70px;height:70px;left:-20px;top:120px"></span>
<span class="bub" style="width:34px;height:34px;right:14px;top:70px"></span>
<span class="bub" style="width:22px;height:22px;right:60px;top:380px"></span>
<span class="bub" style="width:48px;height:48px;left:6px;top:900px"></span>
<main>
  <header class="hero">
    <img class="logo t" src="clube/trident.png" alt="Trident">
    <img class="logo f" src="clube/freshwave.png" alt="Fresh Wave">
    <img class="logo s" src="clube/slogan.png" alt="Uma onda de frescor">
  </header>

  <section class="card" id="login">
    <h2 style="margin-bottom:22px">Digite o PIN para entrar</h2>
    <div class="pin"><input id="pin" type="password" inputmode="text" autocomplete="off" aria-label="PIN"><button class="btn" id="entrar" style="width:auto;margin:0;padding:12px 28px">Entrar</button></div>
    <p class="err" id="err" role="alert"></p>
  </section>

  <section class="card stage" id="palco" hidden>
    <span class="chip">Sorteio de ecobags</span>
    <div class="status" id="info"></div>
    <div class="big" id="nome" style="font-size:clamp(1.6rem,4vw,2.4rem)">Pronto para sortear</div>
    <div class="cards" id="cards"></div>
    <div class="qtd"><label for="qtd">Quantas pessoas sortear:</label>
      <select id="qtd"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select></div>
    <div class="row"><button class="btn" id="sortear">Sortear</button></div>
  </section>

  <section class="card" id="lista" hidden>
    <span class="chip g">Ganhadores</span>
    <table><thead><tr><th>Nº</th><th>Nome</th><th>Curso</th><th>Código</th><th></th></tr></thead><tbody id="corpo"></tbody></table>
  </section>
</main>
<canvas id="cf"></canvas>
<script>
var API='https://script.google.com/macros/s/AKfycbzjTIP9Xidsa3iBuh1OlVdImGOGUZhOu7MwuUbchFzWtvQNu5C5qmWO65RLDKFQeCbkVg/exec';
var PIN='',$=function(i){return document.getElementById(i)};
function call(a,extra){return fetch(API+'?action='+a+(extra||'')+'&pin='+encodeURIComponent(PIN)).then(function(r){return r.json()})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function mostra(r){
  $('info').textContent=r.total+' cadastrados · '+r.restantes+' ainda concorrendo';
  var h='';(r.ganhadores||[]).forEach(function(g){h+='<tr><td>'+esc(g.n)+'</td><td>'+esc(g.nome)+'</td><td>'+esc(g.curso)+'</td><td><b>'+esc(g.c||'')+'</b></td><td class="'+(g.s==='Ausente'?'aus':g.s==='Presente'?'pres':'')+'">'+(g.s==='Ausente'?'Ausente':g.s==='Presente'?'Presente ✔':'')+'</td></tr>'});
  $('corpo').innerHTML=h;$('lista').hidden=!(r.ganhadores||[]).length;
}
$('entrar').onclick=function(){
  PIN=$('pin').value.trim();$('err').textContent='Entrando...';
  call('ganhadores').then(function(r){
    if(!r.ok){$('err').textContent=r.motivo==='pin'?'PIN incorreto.':'Não foi possível entrar agora.';return}
    $('err').textContent='';$('login').hidden=true;$('palco').hidden=false;mostra(r);
  }).catch(function(){$('err').textContent='Sem conexão. Tente de novo.'});
};
$('pin').addEventListener('keydown',function(e){if(e.key==='Enter')$('entrar').click()});

function zap(w){
  var d=String(w.telefone||'').replace(/\D/g,'');if(d.length<10)return '';
  if(d.length<=11)d='55'+d;
  return 'https://wa.me/'+d+'?text='+encodeURIComponent('Oi, '+String(w.nome).split(' ')[0]+'! Parabéns, você ganhou uma ecobag Fresh Wave no sorteio da nossa feira! Venha buscar no estande. Seu código: '+(w.codigo||''));
}
// monta o cartão de um ganhador, com os botões dele
function cartao(w){
  var el=document.createElement('div');el.className='gc';el.setAttribute('data-n',w.n);
  var z=zap(w);
  el.innerHTML='<div class="nm">'+esc(w.nome)+'</div><div class="cu">'+esc(w.curso)+'</div>'+
   '<div class="codbox">Código (confira com a pessoa): <b>'+esc(w.codigo||'(sem código)')+'</b></div>'+
   '<div class="tag" hidden></div>'+
   '<div class="ac">'+(z?'<a class="btn wpp" target="_blank" rel="noopener" href="'+z+'">Avisar no WhatsApp</a>':'')+
   '<button class="btn" data-a="p">Apareceu ✔</button><button class="btn sec" data-a="a">Não compareceu, sortear outro</button></div>'+
   (z?'':'<div class="status">Sem telefone informado.</div>');
  el.querySelector('[data-a=p]').onclick=function(){
    var b=this;b.disabled=true;
    call('presente','&n='+encodeURIComponent(w.n)).then(function(r){if(r.ok){mostra(r);el.classList.add('ok');var t=el.querySelector('.tag');t.hidden=false;t.textContent='Presente ✔';el.querySelectorAll('[data-a]').forEach(function(x){x.hidden=true})}else b.disabled=false}).catch(function(){b.disabled=false});
  };
  el.querySelector('[data-a=a]').onclick=function(){
    el.querySelectorAll('button').forEach(function(x){x.disabled=true});
    call('ausente','&n='+encodeURIComponent(w.n)).then(function(r){
      if(!r.ok)return;mostra(r);
      el.innerHTML='<div class="nm spin" style="font-size:1.6rem">Sorteando outro...</div>';
      var t0=Date.now();
      call('sortear','&qtd=1').then(function(s){
        setTimeout(function(){
          if(s.ok&&s.ganhadores.length){var novo=cartao(s.ganhadores[0]);el.replaceWith(novo);confete();call('ganhadores').then(mostra)}
          else el.innerHTML='<div class="nm" style="font-size:1.4rem">'+(s.motivo==='acabou'?'Acabaram os nomes':'Erro, tente de novo')+'</div>';
        },Math.max(0,2200-(Date.now()-t0)));
      });
    }).catch(function(){el.querySelectorAll('button').forEach(function(x){x.disabled=false})});
  };
  return el;
}
var busy=false;
$('sortear').onclick=function(){
  if(busy)return;busy=true;$('sortear').disabled=true;
  var q=$('qtd').value;$('cards').innerHTML='';
  $('nome').hidden=false;$('nome').className='big spin';$('nome').style.fontSize='clamp(1.6rem,4vw,2.4rem)';$('nome').textContent='Sorteando...';
  var t0=Date.now();
  call('sortear','&qtd='+q).then(function(r){
    setTimeout(function(){
      $('nome').className='big';
      if(!r.ok){$('nome').textContent=r.motivo==='acabou'?'Acabaram os nomes':r.motivo==='vazio'?'Ninguém cadastrado':'Erro, tente de novo';busy=false;$('sortear').disabled=false;return}
      $('nome').hidden=true;
      r.ganhadores.forEach(function(w){$('cards').appendChild(cartao(w))});
      if(r.ganhadores.length<Number(q)){$('info').textContent='Só havia '+r.ganhadores.length+' nome(s) disponível(is).'}
      else $('info').textContent=r.total+' cadastrados · '+r.restantes+' ainda concorrendo';
      $('sortear').textContent='Sortear de novo';confete();
      call('ganhadores').then(function(x){var m=$('info').textContent;mostra(x);if(r.ganhadores.length<Number(q))$('info').textContent=m});
      busy=false;$('sortear').disabled=false;
    },Math.max(0,2200-(Date.now()-t0)));
  }).catch(function(){$('nome').className='big';$('nome').textContent='Sem conexão';busy=false;$('sortear').disabled=false});
};
function confete(){
  var c=$('cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  var cores=['#00BF63','#00873D','#F58A1F','#E94B5B','#7ED321','#F58FB2','#F2D13D'],p=[];
  for(var i=0;i<140;i++)p.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,v:2+Math.random()*4,r:4+Math.random()*6,c:cores[i%7],a:Math.random()*6});
  var f=0;(function an(){x.clearRect(0,0,c.width,c.height);p.forEach(function(q){q.y+=q.v;q.a+=.1;x.fillStyle=q.c;x.save();x.translate(q.x+Math.sin(q.a)*10,q.y);x.rotate(q.a);x.fillRect(-q.r/2,-q.r/2,q.r,q.r*1.6);x.restore()});if(++f<200)requestAnimationFrame(an);else x.clearRect(0,0,c.width,c.height)})();
}
</script>
</html>
